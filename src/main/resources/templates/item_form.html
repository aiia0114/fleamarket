<!-- HTML5 文書であることを宣言 -->
<!DOCTYPE html>
<!-- ルート要素。言語=日本語、Thymeleaf の xmlns を宣言 -->
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!-- ヘッダー領域（メタ・タイトル・スタイル） -->
<head>
    <!-- 文字コードを UTF-8 に設定 -->
    <meta charset="UTF-8">
    <!-- 新規出品か編集かでタイトルを切り替え -->
    <title th:text="${item.id == null ? '商品出品' : '商品編集'}"></title>
    <!-- 共通スタイルシートを読み込み -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<!-- 画面本体 -->
<body>
    <!-- レイアウト用の中央コンテナ -->
    <div class="container">
        <!-- 見出しも新規/編集で切り替え -->
        <h1 th:text="${item.id == null ? '商品出品' : '商品編集'}"></h1>
        <!-- 画像アップロード失敗などのエラーを表示 -->
        <div th:if="${errorMessage}" class="error-message" th:text="${errorMessage}"></div>
        <!-- 新規: /items POST、編集: /items/{id} POST。画像アップロードのため enctype 必須 -->
        <form th:action="${item.id == null ? '/items' : '/items/' + item.id}" method="post"enctype="multipart/form-data">
            <!-- 編集時のみ HiddenHttpMethodFilter を想定し PUT メソッドを指定（サンプルのまま）-->
            <input type="hidden" th:if="${item.id != null}" name="_method" value="put">
                <!-- 商品名の入力 -->
                <p>
                <!-- 商品名ラベル -->
                <label for="name">商品名:</label>
                <!-- 商品名テキストボックス（必須） -->
            <input type="text" id="name"name="name" th:value="${item.name}" required>
            </p>
            <p>
                <!-- 商品説明の入力 -->
                <!-- 商品説明ラベル -->
                <label for="description">商品説明:</label>
                <!-- 複数行テキストエリア。既存値を表示 -->
                <textarea id="description"name="description" rows="5" th:text="${item.description}"></textarea>
            </p>
            <!-- 価格の入力 -->
            <p>
                <!-- 価格ラベル -->
            <label for="price">価格 (¥):</label>
            <!-- 数値入力（小数 2 桁ステップ） -->
            <input type="number" id="price" name="price" th:value="${item.price}" step="0.01" required>
            </p>
            <!-- カテゴリの選択 -->
            <p>
                <label for="categoryId">カテゴリ:</label>
                <select id="categoryId"name="categoryId" required>
                    <option value="">選択してください</option>
                <option th:each="category : ${categories}" th:value="${category.id}"th:text="${category.name}" th:selected="${item.category != null and item.category.id ==category.id}"></option>
                </select>
            </p>
            <!-- 出品タイプ（固定価格 or オークション） -->
            <p>
                <label>出品タイプ:</label>
                <input type="radio" name="type" id="typeFixed" value="FIXED" th:checked="${item.type == null || item.type == 'FIXED'}">
                <label for="typeFixed" style="display:inline;">固定価格</label>
                <input type="radio" name="type" id="typeAuction" value="AUCTION" th:checked="${item.type == 'AUCTION'}">
                <label for="typeAuction" style="display:inline;">オークション</label>
            </p>
            <!-- オークション時のみ表示 -->
            <div id="auctionFields" th:style="${item.type == 'AUCTION'} ? 'display:block' : 'display:none'">
                <p>
                    <label for="startPrice">開始価格 (¥):</label>
                    <input type="number" id="startPrice" name="startPrice" step="0.01" min="0" th:value="${item.startPrice}">
                </p>
                <p>
                    <label for="reservePrice">即時落札価格 (¥):</label>
                    <input type="number" id="reservePrice" name="reservePrice" step="0.01" min="0" th:value="${item.reservePrice}">
                    <span class="hint">（任意）</span>
                </p>
                <p>
                    <label for="auctionEndTime">終了日時:</label>
                    <input type="datetime-local" id="auctionEndTime" name="auctionEndTime" th:value="${item.auctionEndTime != null ? #temporals.format(item.auctionEndTime, 'yyyy-MM-dd''T''HH:mm') : null}">
                </p>
            </div>
            <p>
                <!-- 画像アップロード -->
                <!-- 画像ラベル -->
                <label for="image">商品画像:</label>
                <!-- 画像ファイル選択（画像のみ許可） -->
                <input type="file" id="image"name="image" accept="image/*">
                <!-- 既存画像があればサムネイル表示 -->
                <span th:if="${item.imageUrl}">現在の画像: <img th:src="${item.imageUrl}"style="width: 100px; height: auto;"></span>
            </p>
            <!-- 送信/キャンセルボタン -->
            <div class="button-group">
                <button type="submit" th:text="${item.id == null ? '出品する' : '更新する'}"></button>
                <a th:href="@{/items}" class="button secondary">キャンセル</a>
            </div>
        </form>
    </div>
    <script>
        (function() {
            var typeFixed = document.getElementById('typeFixed');
            var typeAuction = document.getElementById('typeAuction');
            var auctionFields = document.getElementById('auctionFields');
            var priceInput = document.getElementById('price');
            var startPriceInput = document.getElementById('startPrice');
            var auctionEndTimeInput = document.getElementById('auctionEndTime');
            function toggleAuction() {
                var isAuction = typeAuction.checked;
                auctionFields.style.display = isAuction ? 'block' : 'none';
                priceInput.required = !isAuction;
                startPriceInput.required = isAuction;
                auctionEndTimeInput.required = isAuction;
            }
            typeFixed.addEventListener('change', toggleAuction);
            typeAuction.addEventListener('change', toggleAuction);
            toggleAuction();
        })();
    </script>
</body>
</html>

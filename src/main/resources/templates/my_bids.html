<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>入落札の確認 - フリマアプリ</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h1>入落札の確認</h1>
        <p>あなたが入札した商品の一覧です。</p>

        <table>
            <thead>
                <tr>
                    <th>商品名</th>
                    <th>入札額</th>
                    <th>入札日時</th>
                    <th>商品ステータス</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="bid : ${myBids}">
                    <td>
                        <a th:href="@{/items/{id}(id=${bid.item.id})}" th:text="${bid.item.name}"></a>
                        <span th:if="${bid.item.isAuction()}"> (オークション)</span>
                    </td>
                    <td th:text="'¥' + ${#numbers.formatDecimal(bid.bidPrice, 0, 'COMMA', 0, 'POINT')}"></td>
                    <td th:text="${#temporals.format(bid.createdAt, 'yyyy/MM/dd HH:mm')}"></td>
                    <td th:text="${bid.item.status}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(myBids)}">
                    <td colspan="4">入札した商品はありません。</td>
                </tr>
            </tbody>
        </table>

        <div class="button-group">
            <a th:href="@{/my-page}" class="button secondary">マイページに戻る</a>
        </div>
    </div>
</body>
</html>
